transit:                                                            # Source:
  t0: 0.0 # time of inferior conjunction
  per: 1.27492504 # orbital period in days                          # Sing et al. 2024
  rp: 0.122551 # planet radius (in units of stellar radii)          # Sing et al. 2024
  a: 3.7844 # semi-major axis (in units of stellar radii)           # Sing et al. 2024
  inc: 88.49 # orbital inclination (in degrees)                     # Bourrier et al. 2020
  ecc: 0.0085 # eccentricity                                        # Pelletier et al. 2026
  w: 88.95 # longitude of periastron (in degrees)                   # Pelletier et al. 2026
  u: [0.086066667, 0.1542] # limb darkening coefficients [u1, u2]   # From ExoCTK Limb Darkening Calculator
  limb_dark: "quadratic" # limb darkening model
  name: "WASP-121b"
classifier:
  type: cnn # [cnn, rf] for Convolutional Neural Network and Random Forest

