dream:  
  dataset_path: /home/france/Documents/exams/computational/group2-GOTHAM/assignment_2_random_forest/tess_data.csv
  output_dir: "outputs/dream_gan"
  # Dataset and rappresentation 44x44 (1936 points = 968 flux + 968 err)
  image_size: 44
  nc: 1
